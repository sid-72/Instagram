services:
  # Deploy MinIO exactly as defined in the example repo
  - type: web
    repo: https://github.com/render-examples/minio.git

  # Your backend
  - type: web
    name: instagram-backend
    env: docker
    region: oregon
    plan: free
    autoDeploy: true

    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend

    envVars:
      # INTERNAL S3 API (not the console)
      - key: MINIO_ENDPOINT
        value: http://minio-server:9000

      - key: MINIO_ROOT_USER
        sync: false
      - key: MINIO_ROOT_PASSWORD
        sync: false
