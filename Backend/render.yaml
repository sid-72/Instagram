services:
  # 1) MinIO object storage service
  - type: web
    name: instagram-object-storage
    env: docker
    region: oregon              # change if you want
    plan: free                  # or starter, etc.
    autoDeploy: true

    docker:
      image: minio/minio:RELEASE.2024-01-31T20-20-22Z # or latest stable
      command: server /data --console-address ":9001"

    # MinIO listens on 9000 (API) and 9001 (console) by default in this setup
    ports:
      - port: 9000
        protocol: tcp
      - port: 9001
        protocol: tcp

    envVars:
      - key: MINIO_ACCESS_KEY
        sync: false       # set actual value in Render dashboard
      - key: MINIO_SECRET_KEY
        sync: false


    disk:
      name: minio-data
      mountPath: /data
      sizeGB: 10          # adjust as needed

  # 2) Instagram backend (Spring Boot) service
  - type: web
    name: instagram-backend
    env: docker
    region: oregon
    plan: free
    autoDeploy: true

    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend

    envVars:
      # Point backend to MinIO service inside Render's private network
      - key: MINIO_ENDPOINT
        value: http://instagram-object-storage:9000
      - key: MINIO_ACCESS_KEY
        sync: false          # same as on MinIO service
      - key: MINIO_SECRET_KEY
        sync: false

      # Typical Spring settings (tune as needed)
      - key: SPRING_PROFILES_ACTIVE
        value: prod