<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4" style="width: 20rem;">
    <h1 class="card-title text-center mb-4">{{ title }}</h1>
    <p class="text-center text-muted mb-4">Sign up to see photos and videos from your friends.</p>
    
    <form (submit)="onSubmit($event)">
      <div class="form-group mb-3">
        <input type="text" class="form-control" name="name" placeholder="Name" required>
      </div>
      
      <div class="form-group mb-3">
        <input type="text" class="form-control" name="userId" placeholder="Username" required>
      </div>
      
      <div class="form-group mb-3">
        <input type="password" class="form-control" name="password" placeholder="Password" required>
      </div>
      
      <button type="submit" class="btn btn-primary btn-block w-100">Sign Up</button>
    </form>
    
    <div class="text-center mt-3">
      <div class="d-flex align-items-center mb-3">
        <div class="flex-grow-1 border-top"></div>
        <span class="px-3 text-muted small">OR</span>
        <div class="flex-grow-1 border-top"></div>
      </div>
    </div>
    
    <div class="text-center">
      <p class="mb-0">Have an account? <a href="/login">Log in</a></p>
    </div>
  </div>
</div>
